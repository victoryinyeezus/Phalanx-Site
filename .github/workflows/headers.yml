name: headers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/build_headers.py --check
      # Prices before and after the launch ends, page HTML, checkout links;
      # meta descriptions, noindex and image alt text.
      - run: node --test tests/pricing.test.mjs tests/seo.test.mjs
